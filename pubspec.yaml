name: collaborative_asg
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.0.6
  firebase_storage: ^13.4.6

  # Authentication
  google_sign_in: ^7.2.0

  # HTTP
  http: ^1.6.0
  http_parser: ^4.1.2

  # Image & File
  image_picker: ^1.2.1
  image_cropper: ^12.2.1
  file_picker: ^12.1.2

  # Location & Map
  geolocator: ^14.0.3
  google_navigation_flutter: ^0.10.0
  latlong2: ^0.9.1
  flutter_map: ^8.3.2

  # Other App Features
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^19.5.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

  # Reports & Analytics
  fl_chart: ^1.1.1
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  firebase_core_web: 3.10.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - env.json